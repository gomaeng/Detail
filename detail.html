<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Slider</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffffff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            overflow: hidden;
            /* PC에서 높이 비율을 조금 더 줄여서 위아래 간격을 좁힘 (기존 16/10 -> 16/9.2 등 조절 가능) */
            aspect-ratio: 16 / 9.2; 
        }
        .slide-track {
            display: flex;
            transition: transform 0.4s ease-in-out;
            width: 100%;
            height: 100%;
        }
        .slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slide video {
            width: 100%;
            max-width: 700px;
            height: 100%;
            max-height: 100%;
            display: block;
            margin: 0 auto;
            object-fit: contain;
            pointer-events: none;
        }

        /* 제공해 준 핑크 감성 버튼 스타일 적용 */
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            background-color: #fff0f4;
            color: #ff9dbf;
            border: 1.5px solid #ffd6e8;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(255, 214, 232, 0.4);
            z-index: 10;
            transition: all 0.2s ease;
            padding: 0;
        }
        .arrow:hover {
            background-color: #ffd6e8;
            color: #ffffff;
            border-color: #ff9dbf;
            transform: translateY(-50%) scale(1.08);
        }
        .prev { left: 10px; }
        .next { right: 10px; }

        /* 하단 점 네비게이션 (핑크 톤 맞춤) */
        .dots {
            text-align: center;
            position: absolute;
            bottom: 10px;
            width: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #fff0f4;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .dot.active {
            background-color: #ff9dbf;
            width: 20px;
            border-radius: 4px;
        }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .arrow {
                width: 34px;
                height: 34px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="slider-container">
        <div class="slide-track" id="slideTrack">
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530562610762874950/07256.mp4?ex=6a660702&is=6a64b582&hm=b71cb1433b2682ba1d166e8c946e09e1277f3e233d2294e03d540cee9b5138bb&" autoplay loop muted playsinline></video></div>
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530562608397160651/07255.mp4?ex=6a660702&is=6a64b582&hm=bbe87fe35c28fc2340ee1f8ff45da74c822b3e1cfed6fe9a32c4471b1e017bdc&" autoplay loop muted playsinline></video></div>
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530562606878687273/07254.mp4?ex=6a660701&is=6a64b581&hm=ceed365ceb0a84b9622ad649a3dcdcf7707accb68034e11973ea5e1255889f58&" autoplay loop muted playsinline></video></div>
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530562616160948294/07253.mp4?ex=6a660704&is=6a64b584&hm=8728fddfda5f2a228e1d8ae53a934f5c82bd70034f25be65fe8b23ca26a78ab4&" autoplay loop muted playsinline></video></div>
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530562614898200709/07252.mp4?ex=6a660703&is=6a64b583&hm=5e10e15004ec6a70c4afcfa0119ebb9014b60d022cb4e7d4803e758f5985c064&" autoplay loop muted playsinline></video></div>
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530562613614874765/0725.mp4?ex=6a660703&is=6a64b583&hm=2d90f07bb06d3e5ab431ca89a4729d1914ae41826e546d90635abf6e0b5262ba&" autoplay loop muted playsinline></video></div>
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530562611874107572/07251.mp4?ex=6a660703&is=6a64b583&hm=82614b8253996d7498bb923c281656c45d1f6bd085d0f611c4d3169d56a12432&" autoplay loop muted playsinline></video></div>
        </div>

        <button class="arrow prev" onclick="moveSlide(-1)">&#10094;</button>
        <button class="arrow next" onclick="moveSlide(1)">&#10095;</button>

        <div class="dots" id="dotsContainer"></div>
    </div>

    <script>
        const track = document.getElementById('slideTrack');
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dotsContainer');
        let currentIndex = 0;
        const totalSlides = slides.length;

        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('span');
            dot.classList.add('dot');
            if (i === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(i));
            dotsContainer.appendChild(dot);
        }

        const dots = document.querySelectorAll('.dot');

        function updateSlide() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });
        }

        function moveSlide(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = totalSlides - 1; 
            } else if (currentIndex >= totalSlides) {
                currentIndex = 0; 
            }
            updateSlide();
        }

        function goToSlide(index) {
            currentIndex = index;
            updateSlide();
        }
    </script>
</body>
</html>

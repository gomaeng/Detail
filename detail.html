<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Slider</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffffff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            overflow: hidden;
        }
        .slide-track {
            display: flex;
            transition: transform 0.4s ease-in-out;
            width: 100%;
        }
        .slide {
            min-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 해상도와 크기를 최적화하여 용량 체감 및 부하를 줄인 스타일 */
        .slide video {
            width: 100%;
            max-width: 1180px; 
            height: auto;
            display: block;
            margin: 0 auto;
            object-fit: contain;
            pointer-events: none;
        }
        /* 좌우 화살표 버튼 스타일 */
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            padding: 16px 12px;
            cursor: pointer;
            font-size: 20px;
            z-index: 10;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .arrow:hover {
            background-color: rgba(0, 0, 0, 0.7);
        }
        .prev { left: 10px; }
        .next { right: 10px; }

        /* 하단 페이지 인디케이터 (점 표시) */
        .dots {
            text-align: center;
            position: absolute;
            bottom: 15px;
            width: 100%;
            z-index: 10;
        }
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin: 0 5px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .dot.active {
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="slider-container">
        <div class="slide-track" id="slideTrack">
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530557011186548767/d9673e21077aea22.mp4?ex=6a6601cb&is=6a64b04b&hm=52111528012aed3ffd18671b6c2c2bb41434f79f6bc232ea123787b4ebbfcbca&" autoplay loop muted playsinline></video></div>
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530557058204696576/2.mp4?ex=6a6601d7&is=6a64b057&hm=3c62ecaa2d641b1fbeefb4558ef691f14857f78bbb34d60ab9f32b9d6d0c44f4&" autoplay loop muted playsinline></video></div>
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530557117990441042/9f0c72a375ea5251.mp4?ex=6a6601e5&is=6a64b065&hm=5a1a138a783cc083028663f0a98a6969e4bdf91547b57083df925a8b94547a8d&" autoplay loop muted playsinline></video></div>
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530557271669608468/f6e73927259ff1ff.mp4?ex=6a660209&is=6a64b089&hm=0f2412d0592f370aa2b33f3504104df5c8208746a7ffcf6c773a6dfa0b2c1a4c&" autoplay loop muted playsinline></video></div>
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530557345451741224/84a73197a19527d1.mp4?ex=6a66021b&is=6a64b09b&hm=fa3b6ad759de11d790505ca92f2aef3250623c551fdca4630af15479b6033ccf&" autoplay loop muted playsinline></video></div>
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530557500032811139/3bc6dd8687d7b21c.mp4?ex=6a660240&is=6a64b0c0&hm=0952e8524988fec9084e188ca254cea5c810a2012f692809e1ab24d5458b081e&" autoplay loop muted playsinline></video></div>
            <div class="slide"><video src="https://cdn.discordapp.com/attachments/1530554657557057668/1530557982398484662/67ed139a6c3c7fb9.mp4?ex=6a6602b3&is=6a64b133&hm=758cfaa673805c1673237724fd8454cf89cfb915ba5bf854a7766efb898fda1d&" autoplay loop muted playsinline></video></div>
        </div>

        <!-- 좌우 화살표 버튼 -->
        <button class="arrow prev" onclick="moveSlide(-1)">&#10094;</button>
        <button class="arrow next" onclick="moveSlide(1)">&#10095;</button>

        <!-- 하단 점 네비게이션 -->
        <div class="dots" id="dotsContainer"></div>
    </div>

    <script>
        const track = document.getElementById('slideTrack');
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dotsContainer');
        let currentIndex = 0;
        const totalSlides = slides.length;

        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('span');
            dot.classList.add('dot');
            if (i === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(i));
            dotsContainer.appendChild(dot);
        }

        const dots = document.querySelectorAll('.dot');

        function updateSlide() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });
        }

        function moveSlide(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = totalSlides - 1; 
            } else if (currentIndex >= totalSlides) {
                currentIndex = 0; 
            }
            updateSlide();
        }

        function goToSlide(index) {
            currentIndex = index;
            updateSlide();
        }
    </script>

</body>
</html>
